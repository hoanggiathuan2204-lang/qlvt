<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/qlvt/">

<meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">
  <!--
    Optimized viewport for mobile:
    - user-scalable=no prevents accidental zoom on double-tap
    - initial-scale=1.0 ensures proper rendering on mobile devices
  -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="qlvt">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>QLVT - Quản lý vật tư</title>
  <link rel="manifest" href="manifest.json">

  <style>
    /* Prevent FOUC (Flash of Unstyled Content) */
    html, body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: #F4F7FC;
    }
    /* Show a loading indicator while Flutter initializes */
    .loading-placeholder {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #F4F7FC;
      z-index: 9999;
      transition: opacity 0.3s;
    }
    .loading-placeholder.fade-out {
      opacity: 0;
      pointer-events: none;
    }
    .loading-spinner {
      width: 40px;
      height: 40px;
      border: 4px solid #e0e0e0;
      border-top: 4px solid #0D4F8B;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="loading-placeholder" id="loadingPlaceholder">
    <div class="loading-spinner"></div>
  </div>

  <script>
    // Hide loading placeholder when Flutter is ready
    window.addEventListener('flutter-first-frame', function() {
      var el = document.getElementById('loadingPlaceholder');
      if (el) {
        el.classList.add('fade-out');
        setTimeout(function() { el.remove(); }, 300);
      }
    });
    // Fallback: hide after 5s even if event doesn't fire
    setTimeout(function() {
      var el = document.getElementById('loadingPlaceholder');
      if (el) { el.classList.add('fade-out'); setTimeout(function() { el.remove(); }, 300); }
    }, 5000);
  </script>

  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
